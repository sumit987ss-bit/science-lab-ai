name: Deploy POCKET Science Lab preview to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-migration
    paths:
      - 'cloudflare-app/**'
      - '.github/workflows/deploy-cloudflare-preview.yml'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure Cloudflare Pages project exists
        working-directory: cloudflare-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create pocket-science-lab --production-branch main || echo "Project may already exist; the deployment step will verify access."
      - name: Deploy preview branch
        working-directory: cloudflare-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . --project-name pocket-science-lab --branch cloudflare-migration
