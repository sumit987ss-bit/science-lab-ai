name: Cloudflare app validation
on:
  push:
    branches: [cloudflare-migration]
    paths:
      - "cloudflare-app/**"
      - ".github/workflows/cloudflare-app-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloudflare-app/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check cloudflare-app/app.js
          node --check cloudflare-app/experiments.js
          node --check cloudflare-app/functions/api/mentor.js
      - name: Check manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('cloudflare-app/manifest.webmanifest','utf8'))"
      - name: Check experiment catalog counts
        run: |
          node - <<'NODE'
          global.window = global;
          require('./cloudflare-app/experiments.js');
          for (const [name, rows] of Object.entries(LAB_DATA)) {
            if (rows.length !== 25) throw new Error(name + ': expected 25 experiments, got ' + rows.length);
            for (const c of [6,7,8,9,10]) {
              if (rows.filter(x => x.class === c).length !== 5) throw new Error(name + ': class ' + c + ' does not have five experiments');
            }
          }
          console.log('All 100 class-wise experiment records passed.');
          NODE

      - name: Check migrated subject engines and PWA assets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('cloudflare-app/app.js', 'utf8');
          const sw = fs.readFileSync('cloudflare-app/sw.js', 'utf8');
          const html = fs.readFileSync('cloudflare-app/index.html', 'utf8');
          const icon = 'cloudflare-app/icons/pocket-science-lab.svg';
          for (const feature of ['function subjectVisual(it)', 'function subjectObservation(it)', 'function displayChoice(value)', 'function controlNames(it)', 'function quizData(it)']) {
            if (!app.includes(feature)) throw new Error('Missing app feature: ' + feature);
          }
          if (!fs.existsSync(icon)) throw new Error('Missing custom PWA icon');
          if (!html.includes('./icons/pocket-science-lab.svg')) throw new Error('HTML does not reference custom icon');
          if (!sw.includes('./experiments.js') || !sw.includes('./icons/pocket-science-lab.svg')) throw new Error('Offline shell does not precache catalogue/icon');
          console.log('Subject simulation helpers, custom icon and offline assets passed.');
          NODE
