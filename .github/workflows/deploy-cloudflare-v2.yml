name: Deploy POCKET Science Lab v2 to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - render-migration
    paths:
      - 'cloudflare-app/**'
      - '.github/workflows/deploy-cloudflare-v2.yml'

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete Render-tested source
        uses: actions/checkout@v4
        with:
          ref: render-migration
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure the new Cloudflare Pages project exists
        working-directory: cloudflare-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create pocket-science-lab-v2 --production-branch render-migration || echo "Project may already exist; deployment will verify access."
      - name: Deploy production from render-migration
        working-directory: cloudflare-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . --project-name pocket-science-lab-v2 --branch render-migration

      - name: Install browser smoke-test dependency
        working-directory: cloudflare-app
        run: npm install --no-save playwright

      - name: Verify all four Class 8 Biology experiments on the live site
        working-directory: cloudflare-app
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            page.on("pageerror", error => console.error("Browser page error:", error.message));
            await page.goto("https://pocket-science-lab-v2.pages.dev/", { waitUntil: "networkidle" });
            await page.locator('[data-lab="biology"]').click();
            await page.locator("#cl").selectOption("8");
            const expected = [
              "Helpful and Harmful Microorganisms",
              "Stages of Agriculture",
              "Disease-causing microbes / Pathogens",
              "Rabi and Kharif Crops"
            ];
            for (let i = 0; i < expected.length; i++) {
              await page.locator("#ex").selectOption(String(i));
              await page.waitForTimeout(250);
              const screen = await page.locator("#app").innerText();
              if (!screen.includes(expected[i])) {
                throw new Error(`Class 8 Biology experiment ${i + 1} did not render. Expected "${expected[i]}". Screen begins: ${screen.slice(0, 700)}`);
              }
              console.log(`PASS: Class 8 Biology Experiment ${i + 1} — ${expected[i]}`);
            }
          } finally {
            await browser.close();
          }
          NODE
