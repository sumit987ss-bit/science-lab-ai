name: Deploy POCKET Science Lab v2 to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - render-migration
    paths:
      - 'cloudflare-app/**'
      - '.github/workflows/deploy-cloudflare-v2.yml'

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete Render-tested source
        uses: actions/checkout@v4
        with:
          ref: render-migration
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure the new Cloudflare Pages project exists
        working-directory: cloudflare-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create pocket-science-lab-v2 --production-branch render-migration || echo "Project may already exist; deployment will verify access."
      - name: Deploy production from render-migration
        working-directory: cloudflare-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . --project-name pocket-science-lab-v2 --branch render-migration
