services:
  - type: web
    name: pocket-science-lab
    runtime: node
    plan: free
    region: singapore
    rootDir: cloudflare-app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/mentor
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
